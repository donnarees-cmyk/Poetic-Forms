<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poetic Forms</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#24203a;--muted:#6b6584;--bg:#f4f1ff;--purple:#7c3aed;--orange:#f97316;--teal:#0d9488;--pink:#db2777;--blue:#2563eb;--gold:#f59e0b;--good:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito",Arial,sans-serif;color:var(--ink);font-size:18px;line-height:1.55;min-height:100vh;
 background:linear-gradient(180deg,#1e1b4b 0,#312e81 220px,var(--bg) 220px)}
.wrap{max-width:1000px;margin:0 auto;padding:12px 14px 90px}
button{font-family:inherit}
/* HUD */
.hud{position:sticky;top:0;z-index:20;background:rgba(30,27,75,.96);backdrop-filter:blur(6px);color:#fff;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.hud .av{font-size:30px;background:#fff2;border-radius:14px;width:46px;height:46px;display:flex;align-items:center;justify-content:center}
.hud .nm{font-family:Fredoka;font-size:18px;line-height:1.1}
.hud .nm small{display:block;font-family:Nunito;font-size:12px;opacity:.8}
.xpwrap{flex:1 1 160px;min-width:140px}
.xpbar{height:14px;background:#ffffff26;border-radius:99px;overflow:hidden}
.xpfill{height:100%;width:0;background:linear-gradient(90deg,#facc15,#f97316);border-radius:99px;transition:width .8s cubic-bezier(.2,1.4,.4,1)}
.xpl{font-size:12px;font-weight:800;opacity:.9}
.stat{background:#ffffff1f;border-radius:99px;padding:5px 12px;font-weight:800;font-size:16px;white-space:nowrap}
.hbtn{border:none;background:#facc15;color:#422006;border-radius:99px;padding:7px 12px;font-weight:800;cursor:pointer;font-size:15px}
.coin{display:inline-block;animation:spin 3s linear infinite}
@keyframes spin{0%,80%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
/* hero */
header.hero{color:#fff;text-align:center;padding:18px 10px 6px;position:relative}
header.hero h1{font-family:Fredoka;font-size:clamp(30px,6vw,48px);margin:0;text-shadow:0 4px 0 #0005}
header.hero p{margin:4px 0;opacity:.95}
.logo{position:absolute;left:6px;top:8px;height:74px;background:#fff;border-radius:12px;padding:3px}
.stars span{position:absolute;color:#fde68a;animation:tw 2.4s infinite ease-in-out}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
/* cards */
.card{background:#fff;border-radius:22px;padding:18px 20px;margin:14px 0;box-shadow:0 6px 20px rgba(36,32,58,.1)}
h2{font-family:Fredoka;font-size:30px;margin:2px 0 8px;line-height:1.15}
h3{font-family:Fredoka;font-size:23px;margin:4px 0 6px}
.dir{background:#fff8db;border:3px dashed #facc15;border-radius:18px;padding:12px 16px;margin:12px 0}
.dir ol{margin:4px 0;padding-left:24px}
.help{background:#e0f2fe;border-color:#38bdf8}
.say{border:none;background:#eef2ff;color:#3730a3;border-radius:99px;padding:6px 14px;font-weight:800;font-size:15px;cursor:pointer;margin:4px 4px 4px 0}
.say:active{transform:scale(.96)}
.big{border:none;color:#fff;font-family:Fredoka;font-size:22px;border-radius:18px;padding:12px 26px;cursor:pointer;background:var(--orange);box-shadow:0 5px 0 #c2410c;margin:10px 6px 4px 0}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #c2410c}
.big.alt{background:var(--purple);box-shadow:0 5px 0 #5b21b6}
.big:disabled{opacity:.45;cursor:default}
input[type=text]{font-size:20px;padding:10px 14px;border-radius:14px;border:3px solid #ddd6fe;width:100%;max-width:360px;font-weight:800;font-family:Nunito}
/* map */
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:10px}
.node{border:none;border-radius:22px;padding:16px;color:#fff;text-align:left;cursor:pointer;position:relative;min-height:150px;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .2s}
.node:hover:not(.locked){transform:translateY(-4px) rotate(-1deg)}
.node .e{font-size:44px;display:block;animation:bob 2.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.node .t{font-family:Fredoka;font-size:21px;line-height:1.15}
.node .s{font-size:13px;font-weight:800;opacity:.9}
.node.locked{filter:grayscale(1);opacity:.6;cursor:not-allowed}
.node .lk{position:absolute;right:12px;top:10px;font-size:26px}
.node .stars3{position:absolute;right:12px;bottom:10px;font-size:20px}
/* ican */
.ican{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,#ede9fe,#fce7f3);border-radius:18px;padding:12px 16px;margin:8px 0}
.ican .ic{font-size:36px}
.stdtag{display:inline-block;background:#1e1b4b;color:#fff;border-radius:10px;padding:3px 10px;font-size:13px;font-weight:800}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.steps span{background:#ede9fe;border-radius:99px;padding:4px 12px;font-size:14px;font-weight:800;color:#5b21b6}
.steps span.on{background:var(--purple);color:#fff}
.steps span.done{background:#dcfce7;color:#166534}
/* text */
.story{background:#fffdf4;border:3px solid #fde68a;border-radius:18px;padding:12px 18px}
.story p{margin:8px 0}
.pn{display:inline-block;background:#f59e0b;color:#fff;border-radius:50%;width:28px;height:28px;line-height:28px;text-align:center;font-size:14px;font-weight:800;margin-right:6px}
.poem{background:#fdf4ff;border:3px solid #f0abfc;border-radius:18px;padding:12px 18px;margin:10px 0}
.poem h4{font-family:Fredoka;font-size:20px;margin:0 0 4px;color:#a21caf}
.poem .form{display:inline-block;background:#a21caf;color:#fff;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:800}
.poem pre{font-family:Nunito;font-size:18px;white-space:pre-wrap;margin:6px 0}
details{margin:8px 0}
summary{cursor:pointer;font-family:Fredoka;font-size:20px;color:#92400e}
/* teach visuals */
.teach{background:#f8fafc;border-radius:18px;padding:12px 16px;margin:10px 0}
.chain{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.lnk{flex:1 1 160px;max-width:230px;border-radius:16px;padding:12px;text-align:center;color:#fff;font-weight:800;opacity:0;transform:scale(.6)}
.lnk .em{font-size:36px;display:block}
.arrow{align-self:center;font-size:30px;opacity:0;color:#7c3aed}
.play .lnk,.play .arrow{animation:pop .5s forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.plant{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.stage{flex:1 1 200px;max-width:280px;border:3px solid #bbf7d0;border-radius:18px;padding:10px;text-align:center;background:#f0fdf4;cursor:pointer}
.stage .pl{font-size:20px;height:80px;display:flex;align-items:flex-end;justify-content:center;transition:font-size .6s cubic-bezier(.2,1.6,.4,1)}
.stage.grown .pl{font-size:64px}
.stage .st{display:none;font-size:16px}
.stage.grown .st{display:block;animation:fade .5s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.cam{position:relative;background:#0f172a;border-radius:18px;padding:16px;color:#fff;margin:10px 0;overflow:hidden}
.chars{display:flex;justify-content:space-around;position:relative;z-index:1}
.ch{text-align:center;font-size:48px;line-height:1}
.ch small{display:block;font-size:14px;font-weight:800;margin-top:4px}
.lens{position:absolute;top:8px;width:110px;height:110px;border-radius:50%;border:5px solid #facc15;box-shadow:0 0 0 2000px rgba(15,23,42,.55);transition:left .7s cubic-bezier(.3,1.3,.5,1),width .7s,height .7s,top .7s;z-index:2;pointer-events:none}
.camtxt{margin-top:12px;background:#1e293b;border-radius:12px;padding:10px 12px;font-size:16px;min-height:66px;position:relative;z-index:3}
.povbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;position:relative;z-index:3}
.povbtns button{border:none;border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer;background:#334155;color:#fff}
.povbtns button.on{background:#facc15;color:#422006}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:10px 0}
.fcard{border-radius:16px;padding:12px;color:#fff;cursor:pointer;perspective:800px;min-height:150px;position:relative}
.fcard .in{transition:transform .6s;transform-style:preserve-3d;position:relative;min-height:126px}
.fcard.flip .in{transform:rotateY(180deg)}
.fcard .fr,.fcard .bk{position:absolute;inset:0;backface-visibility:hidden}
.fcard .bk{transform:rotateY(180deg);font-size:15px}
.fcard .fe{font-size:40px}
.fcard .fn{font-family:Fredoka;font-size:22px}
.syl{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.syl span{background:#fae8ff;border-radius:8px;padding:2px 7px;font-weight:800;opacity:.25;transition:all .25s}
.syl span.lit{opacity:1;background:#d946ef;color:#fff;transform:translateY(-3px)}
.sylcount{font-family:Fredoka;font-size:22px;color:#a21caf;min-width:40px;display:inline-block}
.model{border-left:6px solid #7c3aed;background:#faf5ff;border-radius:0 16px 16px 0;padding:10px 14px;margin:10px 0}
.model b.th{color:#7c3aed}
/* questions */
.q{background:#faf7ff;border:3px solid #ede9fe;border-radius:18px;padding:14px;margin:12px 0}
.qt{font-weight:800}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{text-align:left;border:3px solid #ddd6fe;background:#fff;border-radius:14px;padding:10px 14px;font-size:17px;font-weight:700;cursor:pointer;color:var(--ink);transition:transform .1s}
.opt:hover:not(:disabled){border-color:var(--purple);transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt.right{background:#dcfce7;border-color:var(--good)}
.opt.wrong{background:#fee2e2;border-color:var(--bad);text-decoration:line-through;opacity:.8}
.opt.reveal{border-color:var(--good);border-style:dashed}
.hint{border:none;background:#fef3c7;color:#92400e;border-radius:99px;padding:6px 14px;font-weight:800;cursor:pointer;font-size:15px}
.hintbox{background:#fef3c7;border-radius:12px;padding:8px 12px;margin-top:8px;font-weight:700;animation:fade .4s}
.fb{border-radius:12px;padding:10px 12px;margin-top:8px;font-weight:700;animation:fade .4s}
.fb.good{background:#dcfce7;color:#14532d}
.fb.try{background:#ffedd5;color:#7c2d12}
.fb.bad{background:#fee2e2;color:#7f1d1d}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* boss */
.boss{text-align:center;background:linear-gradient(180deg,#450a0a,#7f1d1d);color:#fff;border-radius:22px;padding:16px;position:relative;overflow:hidden}
.bossface{font-size:90px;display:inline-block;animation:bob 2s infinite}
.bossface.hit{animation:hit .5s}
@keyframes hit{0%{transform:scale(1)}30%{transform:scale(.8) rotate(-12deg);filter:brightness(3)}60%{transform:scale(1.1) rotate(8deg)}100%{transform:scale(1)}}
.hp{height:22px;background:#0006;border-radius:99px;overflow:hidden;max-width:420px;margin:8px auto}
.hpfill{height:100%;background:linear-gradient(90deg,#22c55e,#facc15);transition:width .6s}
/* floats */
.float{position:fixed;z-index:60;font-family:Fredoka;font-size:26px;color:#f59e0b;text-shadow:0 2px 0 #fff;pointer-events:none;animation:up 1.2s forwards}
@keyframes up{to{transform:translateY(-80px);opacity:0}}
/* badge */
.badgepop{text-align:center;padding:10px}
.badgepop .b{font-size:90px;display:inline-block;animation:badge 1s cubic-bezier(.2,1.6,.4,1)}
@keyframes badge{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
.blist{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.blist span{background:#f5f3ff;border-radius:14px;padding:6px 10px;font-weight:800}
.blist span.no{opacity:.35;filter:grayscale(1)}
/* shop */
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:40;padding:14px;overflow:auto}
.modal.on{display:block}
.mbox{background:#fff;max-width:760px;margin:30px auto;border-radius:22px;padding:18px}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.item{border:3px solid #ede9fe;border-radius:16px;padding:10px;text-align:center;background:#faf7ff}
.item .ie{font-size:46px}
.item button{border:none;border-radius:12px;padding:6px 12px;font-weight:800;cursor:pointer;background:var(--gold);color:#422006;margin-top:4px}
.item button:disabled{background:#e5e7eb;color:#6b7280;cursor:default}
table.rt{width:100%;border-collapse:collapse}
table.rt td,table.rt th{padding:8px;border-bottom:2px solid #ede9fe;text-align:left}

.article{background:#fff;border:3px solid #cbd5e1;border-radius:18px;padding:12px 18px}
.article p{margin:8px 0}.aby{font-size:13px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:1px}
.atitle{color:#0f172a;margin:2px 0 8px}
.feat-heading{font-family:Fredoka;font-size:21px;color:#0d9488;margin:14px 0 4px;border-bottom:3px solid #99f6e4;display:inline-block}
.feat-caption{font-size:16px;background:#f1f5f9;border-radius:10px;padding:6px 10px;margin:4px 0 10px;color:#334155}
.feat-side{background:#fef9c3;border:3px solid #facc15;border-radius:14px;padding:8px 12px;margin:10px 0;font-weight:700;float:none}
.feat-diagram{background:#f0fdfa;border:3px solid #5eead4;border-radius:16px;padding:10px;margin:10px 0}
.dtitle{font-family:Fredoka;font-size:18px;color:#0f766e;text-align:center}
.dsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:8px 0}
.dstep{background:#fff;border-radius:12px;padding:8px;text-align:center;font-size:15px;border:2px solid #99f6e4;animation:pop .5s backwards}
.dstep:nth-child(2){animation-delay:.3s}.dstep:nth-child(3){animation-delay:.6s}.dstep:nth-child(4){animation-delay:.9s}
.dstep span{display:block;font-size:30px}
svg.mound{width:100%;max-width:340px;display:block;margin:0 auto}
.stick{animation:poke 3s ease-in-out infinite;transform-origin:300px 20px}
@keyframes poke{0%,100%{transform:translate(30px,-9px)}40%,60%{transform:translate(0,0)}}
.ants{animation:antz 3s ease-in-out infinite}
@keyframes antz{0%,55%{opacity:0;transform:translate(0,0)}70%{opacity:1}100%{opacity:1;transform:translate(30px,-9px)}}
.hunt{background:#f8fafc;border-radius:16px;padding:10px}
.mini{background:#fff;border:3px solid #e2e8f0;border-radius:14px;padding:10px;display:grid;gap:6px}
.mini>div,.m-b{transition:all .3s;border-radius:8px;padding:4px 6px}
.m-h{font-family:Fredoka;font-size:20px;color:#0d9488}.m-d{text-align:center;font-size:28px;background:#f0fdfa}.m-c{font-size:15px;color:#475569}.m-s{background:#fef9c3;font-weight:700;font-size:15px}
.glow{box-shadow:0 0 0 4px #facc15,0 0 18px 6px #fde047;transform:scale(1.03);background:#fffbeb !important}
.fbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.fbtns button{border:none;border-radius:12px;padding:8px 12px;font-weight:800;background:#e2e8f0;cursor:pointer}
.fbtns button.on{background:#facc15}
.huntx{background:#1e293b;color:#fff;border-radius:12px;padding:10px;margin-top:8px;font-size:16px;min-height:50px}
.umb{background:linear-gradient(180deg,#dbeafe,#eff6ff);border-radius:18px;padding:12px;position:relative;overflow:hidden;min-height:330px}
.utop{text-align:center;font-size:70px;line-height:1}.ulabel{font-size:16px;font-weight:800;background:#2563eb;color:#fff;border-radius:12px;padding:8px;margin:4px auto 0;max-width:520px}
.drops{display:grid;gap:8px;margin-top:12px;justify-items:center}
.drop{background:#fff;border:3px solid #93c5fd;border-radius:12px;padding:6px 12px;font-weight:800;font-size:16px;opacity:0;transform:translateY(-120px)}
.rain .drop{animation:fall .7s forwards}.rain .d1{animation-delay:.2s}.rain .d2{animation-delay:.7s}.rain .d3{animation-delay:1.2s}
.rain .drop.bad{border-color:#fca5a5;animation:fallaway 2.2s 1.7s forwards}
@keyframes fall{to{opacity:1;transform:translateY(0)}}
@keyframes fallaway{0%{opacity:0;transform:translateY(-120px)}35%{opacity:1;transform:translateY(0)}60%{transform:translateY(0) rotate(0)}100%{opacity:0;transform:translate(420px,-40px) rotate(60deg)}}
.pie{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:10px 0}
.slice{border-radius:60px 60px 18px 18px;color:#fff;padding:12px;text-align:center;cursor:pointer;font-size:20px;transition:transform .3s}
.slice:hover{transform:translateY(-4px)}.slice .se{font-size:38px}.slice .sx{display:none;font-size:15px;margin-top:6px;text-align:left}
.slice.open .sx{display:block;animation:fade .4s}
.venn{position:relative;height:230px;margin:10px 0;background:#fff7ed;border-radius:18px;overflow:hidden}
.vc{position:absolute;top:20px;width:180px;height:160px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:15px;color:#fff;transition:left .9s cubic-bezier(.3,1.3,.5,1);padding:10px}
.va{background:rgba(37,99,235,.85);left:2%}.vb{background:rgba(239,68,68,.85);left:calc(98% - 180px)}
.join .va{left:calc(50% - 170px)}.join .vb{left:calc(50% - 10px)}
.vmid{position:absolute;left:50%;top:91%;transform:translate(-50%,-50%) scale(0);background:#facc15;color:#422006;font-weight:800;border-radius:12px;padding:6px 10px;font-size:14px;transition:transform .5s .8s;z-index:2;white-space:nowrap}
.join .vmid{transform:translate(-50%,-50%) scale(1)}
.house{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0}
.hb{opacity:0;transform:translateY(-30px)}
.roof{background:#7c3aed;color:#fff;font-weight:800;padding:14px 18px;clip-path:polygon(50% 0,100% 100%,0 100%);width:100%;max-width:600px;text-align:center;padding:46px 24% 12px;font-size:15px}
.pillars{display:flex;gap:8px;width:100%;max-width:560px;justify-content:space-between}
.pillar{flex:1;background:#ede9fe;border:3px solid #a78bfa;border-radius:8px;padding:12px 6px;text-align:center;font-weight:800;font-size:14px;min-height:110px}
.found{background:#78716c;color:#fff;border-radius:8px;padding:10px;width:100%;max-width:620px;text-align:center;font-weight:800;font-size:14px}
.built .found{animation:pop2 .6s .1s forwards}.built .pillar{animation:pop2 .6s forwards}.built .pillar:nth-child(1){animation-delay:.8s}.built .pillar:nth-child(2){animation-delay:1.1s}.built .pillar:nth-child(3){animation-delay:1.4s}.built .roof{animation:pop2 .7s 2s forwards}
@keyframes pop2{to{opacity:1;transform:translateY(0)}}

.pline{font-size:18px;margin:3px 0}.ln{display:inline-block;min-width:26px;color:#a21caf;font-weight:800;font-size:14px}
.sky{border-radius:18px;padding:14px;color:#fff;background:linear-gradient(180deg,#334155,#475569);transition:background 1s;position:relative}
.sky.s1{background:linear-gradient(180deg,#1e293b,#334155)}.sky.s2{background:linear-gradient(180deg,#0f172a,#1e293b)}.sky.s3{background:linear-gradient(180deg,#312e81,#6d28d9)}
.sky.dawn{background:linear-gradient(180deg,#f59e0b,#fde68a);color:#422006}
.toneTag{position:absolute;right:12px;top:10px;background:#fff;color:#111;border-radius:99px;padding:4px 12px;font-weight:800;font-size:15px}
.sline{padding:3px 8px;border-radius:8px;transition:all .3s;opacity:.6}.sline.lit{opacity:1;background:#ffffff40;transform:scale(1.03);font-weight:800}
.tonebank span{display:inline-block;background:#fce7f3;border-radius:99px;padding:2px 10px;margin:3px;font-weight:800;font-size:15px}
.tm{background:#fefce8;border:3px solid #fde047;border-radius:18px;padding:12px}
.tmscene{min-height:150px;border-radius:14px;padding:12px;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center}
.warp{animation:warp .9s}
@keyframes warp{0%{transform:scale(1)}45%{transform:scale(.2) rotate(180deg);opacity:0;filter:blur(6px)}100%{transform:scale(1) rotate(360deg);opacity:1}}
.era .eem{font-size:44px}.era.old{filter:sepia(.7);background:#fef3c7;border-radius:12px;padding:10px}.era.new{background:#ecfeff;border-radius:12px;padding:10px}
.tm .povbtns button{background:#ca8a04}.tm .povbtns button.on{background:#7c2d12;color:#fff}
.tri{position:relative;max-width:360px;margin:8px auto}.trisvg{width:100%}
.corner{position:absolute;border:none;border-radius:16px;padding:8px 12px;font-weight:800;cursor:pointer;color:#fff;font-size:15px;box-shadow:0 4px 0 #0003;animation:bob 2.5s infinite}

const TEXTS = {
 haiku:{title:"Moon Through Glass", by:"Haiku", blocks:[{l:"Cracked lens, glued with care"},{l:"two small hands lift it skyward"},{l:"the moon still shines through"}]},
 lim:{title:"The Comet", by:"Limerick", blocks:[{l:"A boy with a telescope new"},{l:"Said, \"Look at the stars! There's a few!\""},{l:"But he pointed it wrong,"},{l:"At the cat all along,"},{l:"And the \"comet\" was Whiskers, who flew!"}]},
 free:{title:"Slammed Door", by:"Free Verse", blocks:[{l:"I stood in the hallway"},{l:"                staring"},{l:"at a door that would not open."},{l:"Sorry"},{l:"is such a small word"},{l:"to carry"},{l:"        all the way"},{l:"                across a hallway."}]},
 son:{title:"The Old Lens", by:"Sonnet", blocks:[
  {l:"My grandpa built a telescope by hand,"},{l:"He polished every piece until it shone."},{l:"He taught me how the stars were mapped and planned,"},{l:"And named each one as if it were his own."},
  {l:"Now Grandpa's gone, but still his lens remains,"},{l:"A circle full of nights he used to see."},{l:"I hold it close through sunny days and rains,"},{l:"And feel that he is looking out with me."},

 bHaiku:{title:"Poem 1: First Frost", by:"Haiku", blocks:[{l:"Silver on the grass"},{l:"my breath becomes a small cloud"},{l:"the maple lets go"}]},
 bLim:{title:"Poem 2: Chef McNeil", by:"Limerick", blocks:[{l:"There once was a cat named McNeil,"},{l:"Who cooked a magnificent meal."},{l:"He stirred and he fried,"},{l:"Then he tasted and sighed,"},{l:"\"Just fish again? That's the whole deal!\""}]},
 bFree:{title:"Poem 3: Grandmother's Hands", by:"Free Verse", blocks:[{l:"Her hands"},{l:"are maps"},{l:"of every garden she has planted,"},{l:"every loaf of bread,"},{l:"every scraped knee she has"},{l:"          gently"},{l:"                    bandaged."}]}
};

const WORLDS = [
{ id:"w1", emoji:"🍃", title:"Haiku & Limerick", color:"#0d9488", std:"ELA.6.R.1.4", badge:"🍃", badgeName:"Short Poem Star",
  stdText:"Describe the impact of various poetic forms on meaning and style.",
  ican:"I can describe how the haiku and limerick forms affect a poem's meaning and style.",
  texts:["haiku","lim"],
  teach:`<p>A poem's <b>form</b> is its shape and rules. Poets choose a form <b>on purpose</b> because it changes how the poem <b>sounds</b> and <b>feels</b>. Tap each card!</p>
  <div class="forms">
   <div class="fcard" style="background:#0d9488"><div class="in"><div class="fr"><div class="fe">🍃</div><div class="fn">Haiku</div><small>Tap to flip</small></div><div class="bk"><b>Rules:</b> 3 lines, 5-7-5 syllables, often about nature.<br><b>Effect:</b> short and calm, like a <b>snapshot</b> of one moment.</div></div></div>
   <div class="fcard" style="background:#ea580c"><div class="in"><div class="fr"><div class="fe">🤪</div><div class="fn">Limerick</div><small>Tap to flip</small></div><div class="bk"><b>Rules:</b> 5 lines, AABBA rhyme, bouncy rhythm.<br><b>Effect:</b> <b>silly and playful</b>, often with a funny twist at the end.</div></div></div>
  </div>
  <h3>🔢 Haiku Syllable Counter</h3>
  <div id="sylBox" data-lines='[["Cracked","lens,","glued","with","care"],["two","small","hands","lift","it","sky","ward"],["the","moon","still","shines","through"]]'></div>
  <button class="say" id="countSyl">▶ Count the Syllables</button>
  <h3>🎨 Limerick Rhyme Scheme</h3>
  <div id="rhymeBox" data-lines='[["A boy with a telescope NEW","A"],["Said, Look at the stars! There&apos;s a FEW!","A"],["But he pointed it WRONG,","B"],["At the cat all aLONG,","B"],["And the comet was Whiskers, who FLEW!","A"]]'></div>
  <button class="say" id="rhymeBtn">▶ Show the Rhyme Scheme</button>
  <p>🔎 <b>FAST question words:</b> <i>"How does the form of the poem contribute to its meaning?"</i> • <i>"How does the rhyme and rhythm affect the tone?"</i></p>
  <p>✅ <b>Answer formula:</b> The poem's [form/rule] <b>creates</b> a [feeling/style], which <b>shows</b> [meaning].</p>`,
  mq:"How does the HAIKU form affect \"Moon Through Glass\"?<br>A. Its long lines tell a whole story.<br>B. Its short 5-7-5 lines capture one quiet moment, like a snapshot.<br>C. Its rhyme makes the poem silly.<br>D. Its 14 lines build a serious argument.",
  steps:[
   "🏷️ <b>Name the form and its rules.</b> Haiku = 3 short lines, 5-7-5 syllables.",
   "📖 <b>Read the poem.</b> It shows ONE moment: the moon shining through a fixed lens.",
   "🔗 <b>Connect the rule to the effect.</b> Only 3 short lines means the poet can only show <b>one moment</b>, like taking a <b>snapshot</b>. It feels <b>calm and quiet</b>.",
   "❌ <b>Cross out wrong answers.</b> <span class='x'>A</span>: haiku don't have long lines. <span class='x'>C</span>: this haiku doesn't rhyme. <span class='x'>D</span>: that's a sonnet. <span class='ok'>✅ B!</span>"
  ],
  checks:[
   {q:"How do the AABBA rhyme and bouncy rhythm affect the limerick \"The Comet\"?",o:["They create a silly, playful tone that sets up the funny ending.","They make the poem sad and serious.","They show private thoughts.","They make it sound like a news report."],a:0,hint:"What happens at the end? Is it serious or funny?",why:"The bouncy rhymes build to the joke: the comet was the cat!"},
   {q:"How many syllables are in line 2 of a haiku?",o:["5","7","3","14"],a:1,hint:"Haiku follow a 5-7-5 pattern.",why:"Line 2 of a haiku has 7 syllables."},
   {q:"What is the rhyme scheme of a limerick?",o:["ABAB","AABB","AABBA","No rhyme"],a:2,hint:"Lines 1, 2, and 5 rhyme. Lines 3 and 4 rhyme.",why:"Limericks follow AABBA."},
   {q:"Why might a poet choose a haiku instead of a limerick to write about a quiet sunset?",o:["Haiku are always funny.","A haiku's short, calm form fits a peaceful moment better than a limerick's silly bounce.","Limericks can't be about nature.","Haiku have more lines."],a:1,hint:"Think about the FEELING each form creates.",why:"A haiku's calm snapshot matches a peaceful sunset."}
  ]},
{ id:"w2", emoji:"🌊", title:"Free Verse & Sonnet", color:"#2563eb", std:"ELA.6.R.1.4", badge:"🌊", badgeName:"Form Master",
  stdText:"Describe the impact of various poetic forms on meaning and style.",
  ican:"I can describe how free verse and sonnet forms affect a poem's meaning and style.",
  texts:["free","son"],
  teach:`<div class="forms">
   <div class="fcard" style="background:#2563eb"><div class="in"><div class="fr"><div class="fe">🌊</div><div class="fn">Free Verse</div><small>Tap to flip</small></div><div class="bk"><b>Rules:</b> no set rhyme or rhythm. The poet chooses line breaks and spacing.<br><b>Effect:</b> sounds like <b>real thoughts</b>. Line breaks and spaces show <b>strong feelings</b>.</div></div></div>
   <div class="fcard" style="background:#be123c"><div class="in"><div class="fr"><div class="fe">💌</div><div class="fn">Sonnet</div><small>Tap to flip</small></div><div class="bk"><b>Rules:</b> 14 lines, a rhyme pattern, often ends with a 2-line <b>couplet</b>.<br><b>Effect:</b> <b>serious and organized</b>. The couplet sums up the big idea or adds a twist.</div></div></div>
  </div>
  <h3>👀 Watch the Free Verse Line Breaks</h3>
  <div class="seq" id="fvSeq">
   <div class="rv rvbox">I stood in the hallway</div>
   <div class="rv rvbox" style="padding-left:120px">staring <small>⬅ alone on its own line = a long <b>pause</b>, the speaker is frozen</small></div>
   <div class="rv rvbox">Sorry / is such a small word / to carry</div>
   <div class="rv rvbox" style="padding-left:60px">all the way <small>⬅ spread out = the hallway feels <b>long</b></small></div>
  </div>
  <button class="say" data-replay="#fvSeq">▶ Replay</button>
  <p>🔎 <b>FAST question words:</b> <i>"How does the free verse form help show the speaker's feelings?"</i> • <i>"What is the effect of the final couplet?"</i></p>`,
  mq:"How does the FREE VERSE form help show the speaker's feelings in \"Slammed Door\"?<br>A. The strict rhyme makes the speaker sound happy.<br>B. The uneven line breaks and spaces slow the reader down and show how hard it is to say sorry.<br>C. The 5-7-5 pattern describes nature.<br>D. The couplet tells a joke.",
  steps:[
   "🏷️ <b>Name the form.</b> Free verse: no rhyme, and the poet controls line breaks and spacing.",
   "👀 <b>Look at the SHAPE of the poem.</b> \"staring\" sits alone, pushed far right. \"all the way / across a hallway\" is spread out.",
   "💭 <b>Ask: How does that shape make me read?</b> I <b>pause</b> and <b>slow down</b>, just like the speaker frozen in the hall, struggling to say sorry.",
   "❌ <span class='x'>A</span>: there's no rhyme. <span class='x'>C</span>: that's haiku. <span class='x'>D</span>: there's no couplet or joke. <span class='ok'>✅ B!</span>"
  ],
  checks:[
   {q:"How many lines does a sonnet have?",o:["3","5","14","Any number"],a:2,hint:"Count the lines of \"The Old Lens.\"",why:"A sonnet has 14 lines."},
   {q:"In \"The Old Lens,\" what is the effect of the final couplet (the last two lines)?",o:["It introduces a new character.","It tells a joke.","It sums up the message that broken things can be mended together.","It describes the weather."],a:2,hint:"Reread the last two indented lines.",why:"The couplet states the big idea: broken things can be mended together."},
   {q:"Why does the poet use the sonnet form for \"The Old Lens\"?",o:["Its serious, organized form fits a poem about loss, memory, and love for Grandpa.","Sonnets are always about telescopes.","To make the poem silly.","Because sonnets have no rules."],a:0,hint:"What is the poem about? Is it silly or serious?",why:"The sonnet's serious, careful form matches the deep feelings about Grandpa."},
   {q:"Which feature is found in free verse but NOT in a sonnet?",o:["A set rhyme scheme","Exactly 14 lines","No set rhyme or rhythm","An ending couplet"],a:2,hint:"Free verse means free from rules.",why:"Free verse has no set rhyme or rhythm; sonnets do."}
  ]},
{ id:"w3", emoji:"🧱", title:"Poetry Building Blocks", color:"#7c3aed", std:"ELA.6.R.1.4", badge:"🧱", badgeName:"Structure Builder",
  stdText:"Describe the impact of various poetic forms on meaning and style.",
  ican:"I can explain how stanzas, line breaks, rhyme scheme, and repetition affect a poem's meaning.",
  texts:["wait","lim"],
  teach:`<p>Every poem is built from <b>building blocks</b>. Tap each one to see it light up in the poem!</p>
  <div class="hlwrap">
   <div class="hlbtns"><button data-hl="stanza" data-tip="🧱 <b>Stanza:</b> a group of lines, like a paragraph in a poem. A new stanza often means a new idea or a shift.">🧱 Stanza</button>
    <button data-hl="rep" data-tip="🔁 <b>Repetition:</b> repeating a word or phrase to show what's important or to build a feeling. \"I wait\" repeated shows boredom and impatience!">🔁 Repetition</button>
    <button data-hl="end" data-tip="🎵 <b>Rhyme scheme:</b> the pattern of rhyming words at the ends of lines, labeled with letters (A, B, C...). It creates rhythm and can make a poem playful.">🎵 Rhyme Scheme</button>
    <button data-hl="brk" data-tip="✂️ <b>Line break:</b> where a line ends. Poets break lines to make readers pause or to put extra attention on a word.">✂️ Line Break</button></div>
   <div class="dict" data-hlk="stanza">
    <div><span data-hlk="rep">I wait</span> for the bus.</div>
    <div><span data-hlk="rep">I wait</span> for the bell.</div>
    <div><span data-hlk="rep">I wait</span> for the weekend,</div>
    <div>and <span data-hlk="rep">I wait</span>, and <span data-hlk="rep">I wait</span>.<span data-hlk="brk"> ⏎</span></div>
    <hr><div>The bus was <span data-hlk="end">LATE</span>,</div><div>The bell rang at <span data-hlk="end">EIGHT</span>.</div>
   </div>
   <div class="hlx">👆 Tap a building block</div>
  </div>
  <p>🔎 <b>FAST question words:</b> <i>"What is the effect of the repetition in the poem?"</i> • <i>"How does the structure of the poem contribute to its meaning?"</i></p>`,
  mq:"What is the effect of repeating \"I wait\" in the poem \"Waiting\"?<br>A. It shows the speaker is excited.<br>B. It emphasizes how bored and impatient the speaker feels.<br>C. It creates a rhyme scheme.<br>D. It tells a funny story.",
  steps:[
   "🔁 <b>Find the repetition.</b> \"I wait\" appears <b>6 times</b> in just 4 lines!",

function speak(t){ if(!("speechSynthesis" in window))return; speechSynthesis.cancel();
  t=t.replace(/ELA\.[A-Z0-9.]+/g,"").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}]/gu,"").replace(/[➜▶✦]/g,"").replace(/\s+/g," ").trim();
  const chunks=t.match(/[^.!?]+[.!?"]*\s*/g)||[t];
  chunks.forEach(c=>{const u=new SpeechSynthesisUtterance(c); if(voice)u.voice=voice; u.lang="en-US"; u.rate=.95; speechSynthesis.speak(u);});
}

   <table class="rt"><tr><th>Skill</th><th>I Can</th><th>Checks</th><th>Boss</th></tr>
   ${rows.map(r=>`<tr><td>${r.w.emoji} <b>${r.w.title}</b><br><small>${r.w.std}</small></td><td style="font-size:15px">${esc(r.w.ican)}</td><td>${r.ck}/${r.ckT}</td><td>${r.bc}/${r.bT} ${r.bc===r.bT?"✅":"🔁"}</td></tr>`).join("")}</table>
   <p><b>❌ Missed:</b> ${missed.length?missed.join(", "):"None! 🌟"}</p>
   ${needs.length?`<p>🔁 <b>Review again:</b> ${needs.join(", ")}. Tap that level on the map to rewatch the lesson and the model.</p>`:"<p>🌟 You showed mastery of every standard!</p>"}
   <div class="blist">${WORLDS.map(w=>`<span class="${S.badges.includes(w.id)?"":"no"}">${w.badge} ${w.badgeName}</span>`).join("")}<span>🏆 Boss Slayer</span></div>
   <p style="font-weight:800;margin-top:14px">📸 Take a screenshot of this page and upload it to the Canvas module!</p>
   <p style="font-size:14px;color:#6b6584">Completed ${new Date().toLocaleDateString()}</p>
   <button class="big alt" data-go="map">🗺️ Back to Map</button></div>`;
  confetti();
}

/* =================== EVENTS =================== */
document.addEventListener("click",e=>{
  const t=e.target;
  const wb=t.closest("[data-world]"); if(wb && !wb.classList.contains("locked")){ go("w"+(+wb.dataset.world+1)); return; }
  const bb=t.closest("[data-boss]"); if(bb && !bb.classList.contains("locked")){ go("boss"); return; }
  const gv=t.closest("[data-go]"); if(gv){ go(gv.dataset.go); return; }
  const st=t.closest("[data-step]"); if(st && !st.disabled){ const i=+S.view.slice(1)-1; S.step[WORLDS[i].id]=+st.dataset.step; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  const hb=t.closest("[data-hint]"); if(hb){ S.hints[hb.dataset.hint]=true; save(); refreshChecks(); speak(document.querySelector("#q-"+hb.dataset.hint+" .hintbox").innerText); return; }
  const qb=t.closest("[data-q]");
  if(qb && !qb.disabled){
    const k=qb.dataset.q, n=+qb.dataset.n, [wid,j]=k.split("-"), w=WORLDS.find(x=>x.id===wid), c=w.checks[+j];
    const a=S.ans[k]||{tries:[],done:false,first:false}; if(a.done) return;
    a.tries.push(n);
    if(n===c.a){ a.done=true; a.first=a.tries.length===1&&!S.hints[k];
      const xp=a.tries.length===1?(S.hints[k]?7:10):5, co=a.tries.length===1?5:2;
      S.streak++; S.best=Math.max(S.best,S.streak); reward(xp,co,e.clientX,e.clientY); miniBurst(e.clientX,e.clientY);
    } else { S.streak=0; if(a.tries.length>=2) a.done=true; }
    S.ans[k]=a; save(); hud(); refreshChecks();
    const box=document.getElementById("q-"+k); if(n!==c.a&&box){box.classList.add("shake");}
    const fbEl=box&&box.querySelector(".fb"); if(fbEl) speak(fbEl.innerText);
    return;
  }
  const bq=t.closest("[data-bq]");
  if(bq && !bq.disabled){
    const i=+bq.dataset.bq, n=+bq.dataset.n; if(S.boss[i]!==undefined) return;
    S.boss[i]=n; const ok=n===BOSS[i].a;
    if(ok){ S.streak++; reward(10,5,e.clientX,e.clientY); miniBurst(e.clientX,e.clientY);} else S.streak=0;
    save(); const y=scrollY; vBoss(); scrollTo(0,y); hud();
    if(ok){ const f=$("#bossFace"); f.classList.add("hit"); }
    return;
  }
  if(t.id==="shopBtn"){ renderShop(); $("#shop").classList.add("on"); return; }
  if(t.id==="shopClose"||t.id==="shop"){ $("#shop").classList.remove("on"); return; }
  if(t.id==="mapBtn"){ if(S.name.trim()) go("map"); else go("start"); return; }
  const buy=t.closest("[data-buy]");
  if(buy){ const it=SHOP[+buy.dataset.buy];
    if(S.owned.includes(it.e)){ S.avatar=it.e; } else if(S.coins>=it.c){ S.coins-=it.c; S.owned.push(it.e); S.avatar=it.e; miniBurst(innerWidth/2,innerHeight/2); }
    save(); hud(); renderShop(); return; }
});
function refreshChecks(){ const i=+S.view.slice(1)-1, w=WORLDS[i]; const box=$("#checks"); if(!box) return;
  box.innerHTML=w.checks.map((c,j)=>qHTML(w,j)).join("");
  const tb=$("#toBadge"); if(tb){ const d=worldDone(i); tb.disabled=!d; tb.textContent=d?"Claim My Badge! 🏅":"Answer all checks to continue"; if(d) tb.classList.add("shake"); } }
function renderShop(){ $("#sCoins").textContent=S.coins;
  $("#shopGrid").innerHTML=SHOP.map((it,i)=>{const own=S.owned.includes(it.e); const on=S.avatar===it.e;
    return `<div class="item"><div class="ie">${it.e}</div><b>${it.n}</b><br>${own?(on?"✅ Wearing":`<button data-buy="${i}">Wear</button>`):`<button data-buy="${i}" ${S.coins<it.c?"disabled":""}>🪙 ${it.c}</button>`}</div>`}).join(""); }

/* =================== CONFETTI =================== */
const cv=$("#confetti"), cx=cv.getContext("2d"); let parts=[], anim=null;
function sz(){cv.width=innerWidth; cv.height=innerHeight;} sz(); addEventListener("resize",sz);
const COLS=["#f97316","#ef4444","#7c3aed","#0d9488","#2563eb","#facc15","#16a34a","#db2777"];
function add(n,x,y,sp){for(let i=0;i<n;i++)parts.push({x:x??Math.random()*cv.width,y:y??-20,vx:(Math.random()-.5)*sp,vy:y!=null?Math.random()*-8-2:Math.random()*3+2,r:Math.random()*7+4,c:COLS[i%8],a:Math.random()*6,va:(Math.random()-.5)*.3,l:0}); if(!anim)loop();}
function loop(){cx.clearRect(0,0,cv.width,cv.height); parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.a+=p.va;p.l++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);cx.restore();});
 parts=parts.filter(p=>p.y<cv.height+30&&p.l<420); anim=parts.length?requestAnimationFrame(loop):null; if(!anim)cx.clearRect(0,0,cv.width,cv.height);}
function miniBurst(x,y){add(24,x,y,10);}
function confetti(){let k=0; const t=setInterval(()=>{add(60,null,null,6); if(++k>6)clearInterval(t);},250);}

render();
</script>
